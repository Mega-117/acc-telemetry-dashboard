name: Deploy generated frontend to Cloudflare

# develop -> Develop project (dev.racercore.app); main -> production project (app.racercore.app, PIP-678).

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Package committed assets without rebuilding
        run: node nuxt/scripts/cloudflare-package.mjs docs "$RUNNER_TEMP/cloudflare-publish"
      - name: Publish verified commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ github.ref == 'refs/heads/main' && 'racercore-app' || vars.CLOUDFLARE_PROJECT_NAME }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_PROJECT_NAME"
          npx --yes wrangler@4.130.0 pages deploy "$RUNNER_TEMP/cloudflare-publish" --project-name "$CLOUDFLARE_PROJECT_NAME" --branch "$DEPLOY_BRANCH" --commit-hash "$GITHUB_SHA"
