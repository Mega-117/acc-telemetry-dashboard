# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # CI is the only entry point: no publication can bypass its checks.
  workflow_call:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # PIP-656: only the generated site goes online. Before, the whole repository was published (sources,
      # nuxt/docs notes with real emails, Firebase rules, old dashboards).
      # PIP-672: the app lives at the root of app.racercore.app (custom domain in the repository Pages
      # settings, Nuxt baseURL '/'); old /docs/ links are sent to the new path by the SPA fallback 404.html.
      - name: Stage the generated site only
        run: |
          set -eu
          test -f docs/index.html
          test -f docs/404.html
          mkdir -p _site
          cp -R docs/. _site/
          # Nothing but the build: fail if a source folder slipped in (dev/ is a page of the site).
          for leak in nuxt beta scripts .github firestore.rules database.rules.json package.json; do
            if [ -e "_site/$leak" ]; then echo "unexpected $leak in the Pages artifact" >&2; exit 1; fi
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      # Il backend Pages a volte risponde "Deployment failed, try again later":
      # un errore transitorio non deve lasciare il deploy rosso, quindi si
      # ritenta una volta dopo una pausa prima di fallire davvero.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Attesa prima del retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (retry)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
