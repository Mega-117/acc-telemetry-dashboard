name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "develop", "test-claude"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main", "develop", "test-claude"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # Typecheck + Unit tests (Vitest) — Nuxt FE
  # ─────────────────────────────────────────────
  fe-test:
    name: FE — typecheck + vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"
          cache-dependency-path: nuxt/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: nuxt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Shared frontend checks
        run: python scripts/ci_checks.py --group frontend

      - name: Security audit
        run: npm audit --audit-level=high
        working-directory: nuxt
        continue-on-error: true

      - name: Arch guard — logger must not reference UI
        run: |
          if grep -rn "overlay|feedback|display|notify" logger_core/ 2>/dev/null | grep -v ".pyc"; then
            echo "VIOLATION: logger_core references UI concepts"
            exit 1
          fi
          echo "OK: logger boundary clean"
        continue-on-error: true

  # ─────────────────────────────────────────────
  # Python quality — same lint and tests as the local gate
  # ─────────────────────────────────────────────
  python-test:
    name: Python — flake8 + pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
        working-directory: .

      - name: Shared Python checks
        run: python scripts/ci_checks.py --group python
        working-directory: .

  pages:
    name: Pages — verified commit
    needs: [fe-test, python-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/static.yml

  cloudflare:
    name: Cloudflare — verified develop commit
    needs: [fe-test, python-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
    uses: ./.github/workflows/cloudflare.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # ─────────────────────────────────────────────
  # Release — triggered on version tags v*.*.*
  # ─────────────────────────────────────────────
  release:
    name: Release — build + publish
    runs-on: ubuntu-latest
    needs: [fe-test]
    if: startsWith(github.ref, 'refs/tags/v')

    defaults:
      run:
        working-directory: nuxt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: nuxt/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          ACC_NUXT_PUBLIC_DIR: ../docs

      - name: Archive build artifact
        run: |
          cd ..
          zip -r release-${{ github.ref_name }}.zip docs/ -x "*.git*"
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
